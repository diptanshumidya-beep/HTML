<!DOCTYPE html>
<html>
<head>
<title> Slider in js </title>
<h1> Slder is Nalla</h1>
</head>
<style>
#gradi1{ 
         background:linear-gradient( red,blue,yellow,green, brown,purple)}
</style>
<body id="gradi1">
<section>
<img class="mySlides" src="OIP.jpg" style="height:500px">
<img class="mySlides" src="OIP (1).jpg" style="height:500px">
<img class="mySlides" src="OIP (2).jpg" style="height:500px">
<img class="mySlides" src="OIP (3).jpg" style="height:500px">
<img class="mySlides" src="OIP (4).jpg" style="height:500px">
</section>
<script>
var myIndex = 0;
carousel();

function carousel() {
    var i;
    var x = document.getElementsByClassName("mySlides")
    for (i=0; i < x.length; i++){
    x[i].style.display = "none";
}
myIndex++;
if (myIndex > x.length) {myIndex = 1}
x[myIndex-1].style.display = "block";
setTimeout(carousel, 3000);
}
</script>
</body>
</html>
